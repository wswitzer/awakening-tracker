name: Bootstrap Matt Pocock skills

on:
  pull_request:
    paths:
      - '.bootstrap/skills-request'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Matt Pocock skills source
        env:
          MATT_SKILLS_COMMIT: '2ab958093e83e0ec752e6c1c5932da465bf23e0c'
        run: |
          git clone https://github.com/mattpocock/skills.git /tmp/matt-pocock-skills
          git -C /tmp/matt-pocock-skills checkout --detach "$MATT_SKILLS_COMMIT"
          test "$(git -C /tmp/matt-pocock-skills rev-parse HEAD)" = "$MATT_SKILLS_COMMIT"

      - name: Install pinned Matt Pocock skills for Codex-compatible project use
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npx --yes skills@latest add /tmp/matt-pocock-skills --skill '*' --agent codex --copy --yes

      - name: Verify repo-local skills exist
        run: |
          test -d .agents/skills
          test -f .agents/skills/setup-matt-pocock-skills/SKILL.md
          test -f .agents/skills/ask-matt/SKILL.md
          test -f .agents/skills/implement/SKILL.md
          test -f .agents/skills/code-review/SKILL.md
          count=$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          echo "Installed skill definitions: ${count}"
          test "$count" -ge 22

      - name: Record installation metadata
        run: |
          mkdir -p .agents/skills
          cat > .agents/skills/.matt-pocock-install.json <<'JSON'
          {
            "source": "mattpocock/skills",
            "commit": "2ab958093e83e0ec752e6c1c5932da465bf23e0c",
            "observed_plugin_version": "1.2.0",
            "installer": "skills@latest",
            "agent": "codex",
            "mode": "project-copy"
          }
          JSON

      - name: Commit generated repo-local skills
        run: |
          if git diff --quiet -- .agents/skills && git diff --cached --quiet; then
            echo 'No skill changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills
          git commit -m 'chore: install pinned Matt Pocock skills'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
