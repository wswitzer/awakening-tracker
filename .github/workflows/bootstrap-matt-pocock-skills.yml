name: Bootstrap Matt Pocock skills

on:
  pull_request:
    paths:
      - '.bootstrap/skills-request'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned Matt Pocock skills source
        env:
          MATT_SKILLS_COMMIT: '2ab958093e83e0ec752e6c1c5932da465bf23e0c'
        run: |
          git clone https://github.com/mattpocock/skills.git /tmp/matt-pocock-skills
          git -C /tmp/matt-pocock-skills checkout --detach "$MATT_SKILLS_COMMIT"
          test "$(git -C /tmp/matt-pocock-skills rev-parse HEAD)" = "$MATT_SKILLS_COMMIT"

      - name: Install pinned promoted Matt Pocock skills for Codex-compatible project use
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npx --yes skills@1.5.20 add /tmp/matt-pocock-skills \
            --agent codex --copy --yes \
            --skill ask-matt \
            --skill diagnosing-bugs \
            --skill grill-with-docs \
            --skill triage \
            --skill improve-codebase-architecture \
            --skill setup-matt-pocock-skills \
            --skill tdd \
            --skill to-spec \
            --skill to-tickets \
            --skill wayfinder \
            --skill implement \
            --skill prototype \
            --skill research \
            --skill domain-modeling \
            --skill codebase-design \
            --skill code-review \
            --skill resolving-merge-conflicts \
            --skill grill-me \
            --skill grilling \
            --skill handoff \
            --skill teach \
            --skill writing-great-skills

      - name: Verify exact promoted skill set exists
        run: |
          expected='ask-matt code-review codebase-design diagnosing-bugs domain-modeling grill-me grill-with-docs grilling handoff implement improve-codebase-architecture prototype research resolving-merge-conflicts setup-matt-pocock-skills tdd teach to-spec to-tickets triage wayfinder writing-great-skills'
          actual=$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md -printf '%h\n' | xargs -n1 basename | sort | tr '\n' ' ' | sed 's/ $//')
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"
          for skill in $expected; do
            test -f ".agents/skills/$skill/SKILL.md"
          done

      - name: Record installation metadata
        run: |
          mkdir -p .agents/skills
          cat > .agents/skills/.matt-pocock-install.json <<'JSON'
          {
            "source": "mattpocock/skills",
            "commit": "2ab958093e83e0ec752e6c1c5932da465bf23e0c",
            "observed_plugin_version": "1.2.0",
            "installer": "skills@1.5.20",
            "agent": "codex",
            "mode": "project-copy",
            "scope": "promoted-plugin-skills",
            "skill_count": 22
          }
          JSON

      - name: Commit generated repo-local skills
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills
          if git diff --cached --quiet; then
            echo 'No skill changes to commit.'
            exit 0
          fi
          git commit -m 'chore: install pinned Matt Pocock skills'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
